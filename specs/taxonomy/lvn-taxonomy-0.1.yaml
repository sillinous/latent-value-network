# Need categories mirror skills but represent the demand side
# The complementarity-map.yaml defines which skills serve which needs
# Needs use the same taxonomy IDs with a "need." prefix
# e.g., "practical.home-repair.plumbing" (skill) serves "need.housing.maintenance.plumbing" (need)

