# LVN Cooperative Taxonomy v0.1
# 
# This taxonomy defines the shared vocabulary for human cooperative potential.
# It is designed for COMPLEMENTARITY matching (what you offer meets what I need),
# not SIMILARITY matching (we have the same skills).
#
# Structure: domain → category → subcategories[]
# Complementarity: defined separately in complementarity-map.yaml
#
# Governance: See TAXONOMY-GOVERNANCE.md
# Version: 0.1.0 (semver)
# License: CC BY-SA 4.0

version: "0.1.0"
released: "2026-02-18"

