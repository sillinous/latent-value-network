# LVN Complementarity Map v0.1
#
# This file defines which skills serve which needs.
# This is the core innovation: COMPLEMENTARITY, not similarity.
#
# Format: skill_path → [need_paths]
# Weight: 1.0 = direct match, 0.5 = partial/indirect match
#
# The matching engine uses these mappings to score potential connections.
# A high complementarity score means: "what you can do is exactly what they need."

