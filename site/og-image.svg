<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F1A2E"/>
      <stop offset="100%" style="stop-color:#1B2A4A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Network nodes -->
  <circle cx="200" cy="150" r="40" fill="#2A9D8F" opacity="0.15"/>
  <circle cx="200" cy="150" r="8" fill="#2A9D8F" opacity="0.6"/>
  <circle cx="350" cy="100" r="30" fill="#E9C46A" opacity="0.12"/>
  <circle cx="350" cy="100" r="6" fill="#E9C46A" opacity="0.5"/>
  <circle cx="150" cy="300" r="35" fill="#3D5A80" opacity="0.12"/>
  <circle cx="150" cy="300" r="7" fill="#3D5A80" opacity="0.4"/>
  <circle cx="1000" cy="200" r="45" fill="#2A9D8F" opacity="0.1"/>
  <circle cx="1000" cy="200" r="9" fill="#2A9D8F" opacity="0.5"/>
  <circle cx="1050" cy="450" r="35" fill="#E9C46A" opacity="0.1"/>
  <circle cx="1050" cy="450" r="7" fill="#E9C46A" opacity="0.5"/>
  <circle cx="900" cy="500" r="30" fill="#3D5A80" opacity="0.1"/>
  <circle cx="900" cy="500" r="6" fill="#3D5A80" opacity="0.4"/>
  
  <!-- Connection lines -->
  <line x1="208" y1="150" x2="344" y2="100" stroke="#2A9D8F" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="158" x2="150" y2="293" stroke="#3D5A80" stroke-width="1" opacity="0.12"/>
  <line x1="1000" y1="209" x2="1050" y2="443" stroke="#E9C46A" stroke-width="1" opacity="0.12"/>
  <line x1="1000" y1="209" x2="900" y2="494" stroke="#3D5A80" stroke-width="1" opacity="0.1"/>
  
  <!-- Title -->
  <text x="600" y="240" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="700" fill="white" letter-spacing="-1">The Latent Value Network</text>
  
  <!-- Subtitle -->
  <text x="600" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="rgba(255,255,255,0.5)">What if the help you need is already nearby?</text>
  
  <!-- Divider -->
  <line x1="500" y1="340" x2="700" y2="340" stroke="#2A9D8F" stroke-width="2" opacity="0.4"/>
  
  <!-- Tags -->
  <text x="600" y="390" text-anchor="middle" font-family="monospace" font-size="14" fill="#2A9D8F" letter-spacing="3">OPEN COOPERATIVE PROTOCOL · AI INFRASTRUCTURE</text>
  
  <!-- Stats -->
  <text x="350" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#E9C46A" font-weight="700">$1.3T</text>
  <text x="350" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.35)">Estimated Gap</text>
  <text x="600" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#2A9D8F" font-weight="700">5</text>
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.35)">Protocol Layers</text>
  <text x="850" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="36" fill="#3D5A80" font-weight="700">6</text>
  <text x="850" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="rgba(255,255,255,0.35)">Working Documents</text>
  
  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.25)">github.com/sillinous/latent-value-network</text>
</svg>
